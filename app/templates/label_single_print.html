{% extends "layouts/print.html" %}
{% block title %}Etiqueta{% endblock %}
{% block head %}
    <script src="/static/js/JsBarcode.all.min.js?v={{ static_version() }}"></script>
    <link rel="stylesheet" href="/static/css/tokens.css?v={{ static_version() }}" />
    <link rel="stylesheet" href="/static/css/label-print.css?v={{ static_version() }}" />
{% endblock %}
{% block body %}
    <div class="toolbar">
      <label for="copies">Copias</label>
      <input id="copies" name="copies" type="number" min="1" step="1" value="{{ copies or 1 }}" />
      <button type="button" id="btn-print">Imprimir</button>
      <div class="muted">Etiqueta carrusel: 60mm x 30mm | Barcode: CODE128 (SKU)</div>
    </div>

    <div class="sheet" id="sheet" data-js-label-sku="{{ label.sku or '' }}" data-js-label-name="{{ label.name or '' }}"></div>
    <script type="module" src="/static/js/pages/label-print.js?v={{ static_version() }}"></script>

{% endblock %}
