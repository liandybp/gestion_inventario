{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block head %}
    <link rel="stylesheet" href="/static/css/tokens.css?v={{ static_version() }}" />
    <link rel="stylesheet" href="/static/css/login.css?v={{ static_version() }}" />
    <link rel="stylesheet" href="/static/css/utilities.css?v={{ static_version() }}" />
{% endblock %}
{% block body %}
    <div class="card">
      <h2 class="mt-0">Acceso</h2>
      <div class="muted mb-12">Inicia sesión para usar el sistema.</div>

      {% if error %}
        <div class="error"><strong>{{ error }}</strong></div>
      {% endif %}

      <form method="post" action="/ui/login">
        <div class="row"><label>Usuario</label><input name="username" autocomplete="username" required /></div>
        <div class="row"><label>Contraseña</label><input id="login-password" name="password" type="password" autocomplete="current-password" required /></div>
        <div class="row">
          <label></label>
          <div class="muted">
            <label class="flex items-center gap-8">
              <input id="login-show-password" type="checkbox" class="w-auto" />
              Mostrar contraseña
            </label>
          </div>
        </div>
        <button type="submit">Entrar</button>
      </form>

    </div>
    <script type="module" src="/static/js/pages/login.js?v={{ static_version() }}"></script>
{% endblock %}
