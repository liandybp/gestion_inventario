{# Sin contenido visible: solo el datalist inicial de "Artículo" en Compras, refrescado vía hx-swap-oob. #}
<div id="product-panel"{% if oob %} hx-swap-oob="true"{% endif %}>
  <datalist id="product-options">
    {% for p in product_options %}
      <option value="{{ p.sku }} - {{ p.name }}"></option>
    {% endfor %}
  </datalist>
</div>
