<div class="modal-overlay" id="business-edit-modal">
  <div class="modal-container">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Editar Negocio</h2>
        <button type="button" class="modal-close" data-modal-close="business-edit-modal" aria-label="Cerrar">&times;</button>
      </div>

      {% if message %}
      <div class="message {{ message_class }}">
        <strong>{{ message }}</strong>
        {% if message_detail %}<div class="muted">{{ message_detail }}</div>{% endif %}
      </div>
      {% endif %}

      <form hx-post="/ui/business/{{ business.id }}/update" hx-target="#tab-content" hx-swap="innerHTML">
        <div class="form-group">
          <label for="edit-code">Código *</label>
          <input type="text" id="edit-code" name="code" required autocomplete="off"
                 value="{{ business.code }}" />
        </div>

        <div class="form-group">
          <label for="edit-name">Nombre *</label>
          <input type="text" id="edit-name" name="name" required autocomplete="off"
                 value="{{ business.name }}" />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Guardar Cambios</button>
          <button type="button" class="btn-secondary" data-modal-close="business-edit-modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
