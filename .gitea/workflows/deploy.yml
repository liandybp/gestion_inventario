name: CI + Deploy

on:
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: [dev]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python
        run: python3 --version && python3 -m pip --version
      - name: Install dependencies
        run: |
          pip install -r requirements.txt --break-system-packages -q
          pip install pytest pytest-asyncio --break-system-packages -q
          pip install playwright pytest-playwright --break-system-packages -q
      - name: Install Playwright chromium
        run: |
          python3 -m playwright install chromium
      - name: Tests
        env:
          SESSION_SECRET: test
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: test
          OPERATOR_USERNAME: operator
          OPERATOR_PASSWORD: test
        run: |
          python3 -m pytest tests/unit -v --override-ini="addopts="
      - name: E2E (Playwright)
        env:
          SESSION_SECRET: test
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: test
          OPERATOR_USERNAME: operator
          OPERATOR_PASSWORD: test
        run: |
          python3 -m pytest tests/e2e -m e2e -q --override-ini="addopts="

  deploy-dev:
    needs: [test]
    if: gitea.ref == 'refs/heads/develop'
    runs-on: [dev]
    steps:
      - name: Deploy to dev (ai-lab-home)
        run: |
          set -e
          cd ~/staging/gestion_inventario
          git fetch origin develop --force
          git reset --hard origin/develop
          sudo systemctl restart gestion-inventario-dev.service
          sleep 6
          curl -fsS http://localhost:10000/health
          echo "OK: dev desplegado"

  deploy-prod:
    needs: [test]
    if: gitea.ref == 'refs/heads/main'
    runs-on: [prod]
    steps:
      # laptop-server: sin clave SSH ni Node; el stack vive en ~/apps/docker-compose.yml
      # y usa la imagen local gestion_inventario-app:latest que se construye aquí.
      - name: Deploy to prod (laptop-server)
        env:
          GIT_TOKEN: ${{ gitea.token }}
          REPO_URL: http://192.168.1.21:3001/${{ gitea.repository }}.git
          IMAGE: gestion_inventario-app
        run: |
          set -euo pipefail
          SRC=~/src/gestion_inventario
          AUTH="Authorization: Basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)"
          [ -d "$SRC/.git" ] || git init -q "$SRC"
          cd "$SRC"
          git -c http.extraHeader="$AUTH" fetch --depth 1 "$REPO_URL" "${{ gitea.ref }}"
          git reset -q --hard FETCH_HEAD
          EXPECTED=$(cat VERSION)

          docker image inspect "$IMAGE:latest" >/dev/null 2>&1 \
            && docker tag "$IMAGE:latest" "$IMAGE:previous"
          docker build -q -t "$IMAGE:latest" .

          health() {
            docker exec gestion_inventario python -c "import json,urllib.request;d=json.load(urllib.request.urlopen('http://localhost:10000/health',timeout=5));print(d);assert d['version']=='$EXPECTED'"
          }
          wait_healthy() {
            for _ in $(seq 1 20); do health && return 0; sleep 3; done; return 1
          }

          cd ~/apps
          docker compose up -d --no-deps gestion_inventario
          if wait_healthy; then
            echo "OK: prod desplegado $EXPECTED"
          else
            echo "FALLO: health KO, rollback a $IMAGE:previous"
            docker logs --tail 50 gestion_inventario || true
            docker tag "$IMAGE:previous" "$IMAGE:latest"
            docker compose up -d --no-deps gestion_inventario
            exit 1
          fi
