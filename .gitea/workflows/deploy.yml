name: CI + Deploy

on:
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: apt-get update -qq && apt-get install -y -qq python3 python3-pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt --break-system-packages -q
          pip install pytest pytest-asyncio --break-system-packages -q
          pip install playwright pytest-playwright --break-system-packages -q
      - name: Install Playwright chromium
        run: |
          python3 -m playwright install chromium
      - name: Tests
        env:
          SESSION_SECRET: test
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: test
          OPERATOR_USERNAME: operator
          OPERATOR_PASSWORD: test
        run: |
          python3 -m pytest tests/unit -v --override-ini="addopts="
      - name: E2E (Playwright)
        env:
          SESSION_SECRET: test
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: test
          OPERATOR_USERNAME: operator
          OPERATOR_PASSWORD: test
        run: |
          python3 -m pytest tests/e2e -m e2e -q --override-ini="addopts="

  deploy-dev:
    needs: [test]
    if: gitea.ref == 'refs/heads/develop'
    runs-on: [dev]
    steps:
      - name: Deploy to dev (ai-lab-home)
        run: |
          set -e
          cd ~/staging/gestion_inventario
          git fetch origin develop --force
          git reset --hard origin/develop
          sudo systemctl restart gestion-inventario-dev.service
          sleep 6
          curl -fsS http://localhost:10000/health
          echo "OK: dev desplegado"

  deploy-prod:
    needs: [test]
    if: gitea.ref == 'refs/heads/main'
    runs-on: [prod]
    steps:
      - name: Deploy to prod (vm-apps)
        run: |
          set -e
          cd ~/PyCharmMiscProject/gestion_inventario
          git pull
          docker compose -f docker-compose-homelab.yml up -d --build
          sleep 6
          curl -fsS http://localhost:10000/health
          echo "OK: prod desplegado"
